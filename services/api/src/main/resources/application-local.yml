# 本地开发配置：不包含任何真实密钥，密码必须由环境变量提供
server:
  # 本机 8080 被系统保留（socket bind 报 WinError 10013），本地开发固定走 8081
  # 管理端 vite proxy 与小程序 VITE_SERVER_BASEURL 都与该端口对齐
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:insurance_training}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:app}
    # 不设默认值：缺失时启动失败，避免把弱口令写进代码库
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.insurance.training: debug

app:
  jwt:
    # 仅本地开发使用；生产由 application-prod.yml 强制要求环境变量
    secret: ${APP_JWT_SECRET:local-dev-only-jwt-secret-please-change-32b}
  wechat:
    appid: ${WECHAT_APPID:touristappid}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:training-private}
